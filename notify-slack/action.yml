# Notifikace o běhu workflow do Slacku, do kanálu, pro který je vystavený
# webhook.
#
#   event: start    běh začal
#   event: result   běh skončil — úspěch, selhání nebo zrušení
#
# U `result` patří action do závěrečného jobu s `if: always()` a `needs` na
# všechny joby, o kterých má rozhodovat. Ze `needs` se pozná, jestli něco
# selhalo; který krok a odkaz na jeho log si action dohledá přes API běhu,
# takže job potřebuje `permissions: actions: read`.
#
#   uses: audiolibrix/github-actions/notify-slack@v1
#
# Zprávy tagují toho, kdo běh spustil, a vlastníka repa (input `owner`).
# Slack ID k GitHub loginům sem do veřejného repa nepatří.
# Jsou v souboru slack-users.json v privátním repu, které čte GitHub App
# s právem jen na to repo. Bez ní zprávy uvedou jen loginy.
#
# Selhání notifikace běh neshodí — Slack, který zrovna neodpovídá, nemá
# zastavit nasazení. Skončí to varováním v logu.
name: Notifikace do Slacku
description: Pošle do Slacku začátek nebo výsledek běhu workflow.

inputs:
  webhook:
    description: URL incoming webhooku Slacku, předává se ze secretu.
    required: true
  event:
    description: "`start`, nebo `result`"
    required: true
  title:
    description: Jméno, pod kterým se běh ve zprávě ohlásí. Bez něj jméno repozitáře.
    required: false
  needs:
    description: Pro `result` — `toJSON(needs)` závěrečného jobu.
    required: false
    default: "{}"
  success-text:
    description: Pro `result` — co znamená úspěch, třeba „Nasazeno, release 1.4.2“.
    required: false
  failure-text:
    description: Pro `result` — vysvětlení navíc, když něco selže.
    required: false
  github-token:
    description: Token na čtení jobů a commitu přes API.
    required: false
    default: ${{ github.token }}
  owner:
    description: GitHub login vlastníka repa, víc loginů oddělte mezerou. Bez něj zpráva vlastníka neuvede.
    required: false
  people-repository:
    description: Privátní repo (`owner/repo`) se souborem slack-users.json, který mapuje GitHub login na Slack member ID.
    required: false
  people-client-id:
    description: Client ID GitHub App, která to repo čte.
    required: false
  people-private-key:
    description: Privátní klíč té GitHub App.
    required: false

runs:
  using: composite
  steps:
    # Token se vydává instalaci v organizaci repa s mapováním, ne volajícího.
    - id: people-owner
      if: inputs.people-repository != '' && inputs.people-client-id != '' && inputs.people-private-key != ''
      shell: bash
      env:
        PEOPLE_REPOSITORY: ${{ inputs.people-repository }}
      run: echo "owner=${PEOPLE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"

    # Token jen na čtení toho jednoho repa, i kdyby aplikace jednou směla víc.
    # Když se nepovede, zpráva odejde bez tagů.
    - id: people-token
      if: steps.people-owner.outputs.owner != ''
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.people-client-id }}
        private-key: ${{ inputs.people-private-key }}
        owner: ${{ steps.people-owner.outputs.owner }}
        repositories: ${{ inputs.people-repository }}
        permission-contents: read

    - uses: actions/github-script@v9
      env:
        NOTIFY_OWNER: ${{ inputs.owner }}
        NOTIFY_PEOPLE_REPOSITORY: ${{ inputs.people-repository }}
        NOTIFY_PEOPLE_TOKEN: ${{ steps.people-token.outputs.token }}
        NOTIFY_WEBHOOK: ${{ inputs.webhook }}
        NOTIFY_EVENT: ${{ inputs.event }}
        NOTIFY_TITLE: ${{ inputs.title }}
        NOTIFY_NEEDS: ${{ inputs.needs }}
        NOTIFY_SUCCESS_TEXT: ${{ inputs.success-text }}
        NOTIFY_FAILURE_TEXT: ${{ inputs.failure-text }}
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const notifySlack = require(`${process.env.ACTION_PATH}/notify.js`);
          await notifySlack({ github, context, core });
